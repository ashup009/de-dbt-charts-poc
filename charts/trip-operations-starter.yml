title: Trip Operations Starter
text: Trip activity from January 1 through February 4, 2023. Completed fares exclude canceled and no-show trips.
source: de_dev
queries:
  totals:
    sql: |
      SELECT COUNT(*) AS total_trips,
             ROUND(100.0 * SUM(CASE WHEN status = 'Completed' THEN 1 ELSE 0 END) / COUNT(*), 1) AS completion_pct,
             ROUND(SUM(CASE WHEN status = 'Completed' THEN fare_amount ELSE 0 END), 2) AS completed_fares
      FROM stg.trips
    formats:
      completion_pct: percent_number
      completed_fares: currency
  daily:
    sql: |
      SELECT CAST(pickup_time AS DATE) AS trip_day, COUNT(*) AS trips
      FROM stg.trips
      GROUP BY 1 ORDER BY 1
  cities:
    sql: |
      SELECT city, ROUND(SUM(CASE WHEN status = 'Completed' THEN fare_amount ELSE 0 END), 2) AS completed_fares
      FROM stg.trips
      GROUP BY city ORDER BY completed_fares DESC
    formats:
      completed_fares: currency
  statuses:
    sql: |
      SELECT status, COUNT(*) AS trips
      FROM stg.trips
      GROUP BY status ORDER BY trips DESC
charts:
  total_trips:
    type: kpi
    query: totals
    value: total_trips
    label: Total Trips
  completion:
    type: kpi
    query: totals
    value: completion_pct
    label: Completion Rate
  fares:
    type: kpi
    query: totals
    value: completed_fares
    label: Completed Fares
  daily_trips:
    type: line
    query: daily
    title: Daily Trip Volume
    x: trip_day
    y: trips
  city_fares:
    type: bar
    query: cities
    title: Completed Fares by City
    x: city
    y: completed_fares
  trip_status:
    type: bar
    query: statuses
    title: Trips by Status
    x: status
    y: trips
rows:
  - cols: [total_trips, completion, fares]
  - daily_trips
  - cols: [city_fares, trip_status]

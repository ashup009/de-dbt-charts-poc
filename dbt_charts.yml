sources:
  de_dev:
    type: databricks
    host: "{{ env_var('DCT_DE_DEV_HOST', 'localhost') }}"
    http_path: "{{ env_var('DCT_DE_DEV_HTTP_PATH', '/sql/1.0/warehouses/unused') }}"
    catalog: "{{ env_var('DCT_DE_DEV_CATALOG', 'main') }}"
    client_id: "{{ env_var('DCT_DE_DEV_CLIENT_ID', 'unused') }}"
    client_secret: "{{ env_var('DCT_DE_DEV_CLIENT_SECRET', 'unused') }}"
